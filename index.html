<!doctype html><html lang="pt-br"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#171c26">
<meta name="apple-mobile-web-app-capable" content="yes"><title>Noticias MNQ</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#0f1218;color:#e6e9ef;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:2;background:#171c26;border-bottom:2px solid #f0a020;padding:6px 8px;display:flex;align-items:center;justify-content:space-between;gap:6px;height:38px}
h1{margin:0;font-size:18px;color:#f0a020;text-align:center}#st{font-size:12px;color:#9ab;text-align:right;width:90px}
#dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#666;margin-right:4px}#dot.on{background:#3ddc6a}#dot.off{background:#ff5050}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{position:sticky;top:38px;background:#1d2330;color:#9ab;font-size:11px;font-weight:700;text-align:center;padding:4px 2px;border:1px solid #2a3240}
td{border:1px solid #2a3240;padding:5px 4px;vertical-align:middle;font-size:13px;font-variant-numeric:tabular-nums}
col.h{width:62px}col.l{width:58px}col.i{width:58px}
td.h,td.l,td.i{text-align:center;white-space:nowrap;font-size:12px}td.l{font-weight:700}
td.m{font-size:15px;line-height:1.25;text-transform:uppercase;word-break:break-word}
.COMPRA{color:#3ddc6a}.VENDE{color:#ff5050}.NEUTRO{color:#c8ccd4}
tr.hi{background:#123d1e}tr.hi td.m{color:#7dffa0}
tr.brk{background:#1b6b35!important}tr.brk td{color:#fff!important;font-weight:700;border-color:#1b6b35}
tr.novo td{animation:pisca 2s ease-out}@keyframes pisca{from{background:#f0a02066}}
.vz{padding:24px 10px;text-align:center;color:#9ab;font-size:14px}
</style></head><body>
<header><span style="width:90px"></span><h1>NOTICIAS MNQ</h1><span id="st"><span id="dot"></span><span id="n"></span></span></header>
<table><colgroup><col class="h"><col class="l"><col><col class="i"></colgroup>
<thead><tr><th>HORA</th><th>LADO</th><th>MANCHETE</th><th>IMPACTO</th></tr></thead><tbody id="tb"></tbody></table>
<div id="vz" class="vz" style="display:none"></div>
<script>
// O topico ntfy NAO fica no codigo: vem no fragmento do link (#k=...), que o navegador nunca envia ao servidor,
// e fica guardado so neste celular (localStorage).
(function(){const m=location.hash.match(/k=([\w-]+)/);if(m){localStorage.setItem('mnq_k',m[1]);history.replaceState(null,'',location.pathname)}})();
const K=localStorage.getItem('mnq_k'),JAN=864e5;
let items={};try{items=JSON.parse(localStorage.getItem('mnq_itens')||'{}')}catch(e){items={}}
let lastId=localStorage.getItem('mnq_last')||'',novos=new Set();
const p2=n=>String(n).padStart(2,'0'),hms=t=>{const d=new Date(t);return p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds())};
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
const LADO={ALTA:'COMPRA',BAIXA:'VENDE'};
const troca=h=>h.replace(/(NQ\/MNQ:\s*|Vi\S*s:\s*|^)(ALTA|BAIXA)\b/g,(a,b,w)=>b+LADO[w]);
function parse(m){const t=m.title||'',b=m.message||'';
 if(m.event!=='message'||/TESTE|Teste de rota/i.test(t+b)||!/BREAKING NEWS|NOT[IÍ]CIA/.test(t))return null;
 const v=(t.match(/NQ\/MNQ:\s*(ALTA|BAIXA|NEUTRO)/)||[])[1]||'NEUTRO';let im=((t.match(/Impacto\s+(\S+)/)||[])[1]||'').toUpperCase();
 let h=t.split(/Impacto\s+\S+\s*[-—–]\s*/)[1]||t.replace(/^.*?[—–-]\s*/,'');
 if(h.endsWith('…')){const mb=b.match(/Impacto\s+\S+\s*[-—–]\s*(.+)/);if(mb)h=mb[1].split('\n')[0]}
 h=h.replace('(reenvio)','').trim();const br=/BREAKING/.test(t);if(br)im='ALTO';  // breaking enviada = sempre ALTO
 return{id:m.id,t:m.time*1000,lado:LADO[v]||'NEUTRO',impacto:im,manchete:troca(h),breaking:br}}
const peq=x=>!x.breaking&&/^(BAIX|PEQ)/i.test(x.impacto||'');
function render(){const lim=Date.now()-JAN;for(const k in items)if(items[k].t<lim)delete items[k];
 localStorage.setItem('mnq_itens',JSON.stringify(items));
 const L=Object.values(items).filter(x=>!peq(x)).sort((a,b)=>b.t-a.t);
 document.getElementById('tb').innerHTML=L.map(x=>{const c=(x.breaking?'brk':(/^AL/.test(x.impacto)?'hi':''))+(novos.has(x.id)?' novo':'');
  return`<tr class="${c}"><td class="h">${hms(x.t)}</td><td class="l ${x.lado}">${x.lado}</td><td class="m">${esc(x.manchete)}</td><td class="i">${esc(x.impacto)}</td></tr>`}).join('');
 const vz=document.getElementById('vz');vz.style.display=L.length?'none':'block';
 vz.textContent=K?'Nenhuma noticia de impacto medio ou alto nas ultimas 24h.':'Abra pelo link completo (com #k=...) uma vez neste celular.';
 document.getElementById('n').textContent=L.length+' noticias';novos.clear()}
const st=ok=>document.getElementById('dot').className=ok?'on':'off';
let ocupado=false;
async function puxa(){if(!K||ocupado)return;ocupado=true;try{
  const r=await fetch(`https://ntfy.sh/${K}/json?poll=1&since=${lastId||'24h'}`,{cache:'no-store'});if(!r.ok)throw 0;
  let novo=false;const primeira=!Object.keys(items).length;
  for(const l of (await r.text()).split('\n')){if(!l)continue;const m=JSON.parse(l);if(m.event!=='message')continue;lastId=m.id;
   const x=parse(m);if(x&&!items[x.id]){items[x.id]=x;if(!primeira&&!peq(x)){novos.add(x.id);novo=true}}}
  localStorage.setItem('mnq_last',lastId);render();st(true);if(novo)window.scrollTo(0,0)}catch(e){st(false)}ocupado=false}
render();puxa();setInterval(puxa,4000);
setInterval(()=>{lastId='';puxa()},180000);           // recarga de seguranca: repuxa o cache inteiro do ntfy
setTimeout(()=>location.reload(),1800000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)puxa()});
</script></body></html>
